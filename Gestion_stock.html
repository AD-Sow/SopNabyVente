<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitrine stock - Pôle vente SNF</title>

  <style>
    :root {
      --gold: #d4a017;
      --gold-dark: #a97906;
      --gold-soft: #f3c94f;
      --bg: #070707;
      --glass: rgba(33, 27, 16, 0.58);
      --glass-strong: rgba(33, 27, 16, 0.75);
      --border: rgba(212, 160, 23, 0.28);
      --text: #f4f4f4;
      --muted: #b8b8b8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% -5%, rgba(212,160,23,.2), transparent 36%),
        radial-gradient(circle at 100% 0%, rgba(212,160,23,.12), transparent 42%),
        radial-gradient(circle at 50% 110%, rgba(255,255,255,.04), transparent 30%),
        var(--bg);
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:
        0 8px 28px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.04);
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .logo-box {
      width: 74px;
      height: 74px;
      border: 2px solid rgba(212,160,23,.5);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(0,0,0,.35);
      flex-shrink: 0;
      display: block;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      color: var(--gold-soft);
      letter-spacing: .2px;
    }

    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid rgba(212,160,23,.3);
      border-radius: 10px;
      background: rgba(0,0,0,.3);
      color: #fff;
      font-weight: 700;
      padding: 9px 12px;
      cursor: pointer;
      transition: .2s ease;
    }

    button:hover {
      border-color: rgba(212,160,23,.7);
      color: var(--gold-soft);
      transform: translateY(-1px);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .kpi {
      border: 1px solid rgba(212,160,23,.25);
      border-radius: 12px;
      background: rgba(0,0,0,.23);
      padding: 10px;
    }

    .kpi .label {
      font-size: .78rem;
      color: #c7c7c7;
    }

    .kpi .value {
      margin-top: 5px;
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--gold-soft);
    }

    .kpi.green .value { color: #4ade80; }
    .kpi.red .value { color: #ef4444; }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .search {
      width: 100%;
      border: 1px solid rgba(212,160,23,.25);
      border-radius: 10px;
      background: rgba(0,0,0,.35);
      color: #fff;
      padding: 10px 12px;
      outline: none;
      font-size: .92rem;
    }

    .search:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,160,23,.18);
    }

    /* GRILLE PRODUITS */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .p-card {
      position: relative;
      border: 1px solid rgba(212,160,23,.3);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(0,0,0,.35);
      cursor: pointer;
      transition: .2s ease;
    }

    .p-card:hover {
      transform: translateY(-3px);
      border-color: rgba(212,160,23,.7);
      box-shadow: 0 12px 26px rgba(0,0,0,.45);
    }

    .p-photo {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
      background: #1e1e1e;
    }

    .p-content {
      padding: 10px;
    }

    .p-name {
      margin: 0;
      font-size: .95rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
    }

    .p-meta {
      margin-top: 6px;
      color: #cfcfcf;
      font-size: .8rem;
      display: grid;
      gap: 2px;
    }

    .p-badge-wrap {
      position: absolute;
      top: 9px;
      right: 9px;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: .72rem;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .ok { background: rgba(22,163,74,.92); }
    .low { background: rgba(217,119,6,.92); }
    .out { background: rgba(220,38,38,.92); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 18px;
    }

    /* GRAPH */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 10px;
      color: #ddd;
      font-size: .82rem;
    }

    .legend span::before {
      content: "";
      display: inline-block;
      width: 11px;
      height: 11px;
      margin-right: 6px;
      border-radius: 3px;
      vertical-align: -1px;
    }

    .legend .pot::before { background: var(--gold); }
    .legend .act::before { background: #22c55e; }
    .legend .recu::before { background: #38bdf8; }
    .legend .vendu::before { background: #22c55e; }

    .chart-scroll { overflow-x: auto; }

    .chart {
      height: 270px;
      min-width: max-content;
      display: flex;
      align-items: flex-end;
      gap: 16px;
      padding: 8px 6px 0;
      border-bottom: 2px solid rgba(212,160,23,.25);
    }

    .group {
      width: 82px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .bars {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: flex-end;
      gap: 5px;
    }

    .col {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .v {
      font-size: .67rem;
      color: #ddd;
      margin-bottom: 3px;
      white-space: nowrap;
    }

    .bar {
      width: 100%;
      min-height: 2px;
      border-radius: 5px 5px 0 0;
    }

    .bar.pot {
      background: linear-gradient(180deg, var(--gold-soft), var(--gold-dark));
    }

    .bar.act {
      background: linear-gradient(180deg, #4ade80, #15803d);
    }

    .bar.recu {
      background: linear-gradient(180deg, #7dd3fc, #0369a1);
    }

    .bar.vendu {
      background: linear-gradient(180deg, #4ade80, #15803d);
    }

    .labels {
      min-width: max-content;
      display: flex;
      gap: 16px;
      padding: 6px 6px 0;
    }

    .labels div {
      width: 82px;
      text-align: center;
      font-size: .74rem;
      color: #ddd;
      overflow-wrap: anywhere;
    }

    /* MODALE */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .overlay.active { display: flex; }

    .modal {
      width: min(95%, 560px);
      max-height: 92vh;
      overflow-y: auto;
      border: 1px solid rgba(212,160,23,.55);
      border-radius: 18px;
      background: var(--glass-strong);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 18px;
      box-shadow: 0 22px 55px rgba(0,0,0,.58);
    }

    .m-head {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .m-photo {
      width: 102px;
      height: 102px;
      border-radius: 16px;
      object-fit: cover;
      border: 3px solid rgba(212,160,23,.7);
      background: #222;
      box-shadow: 0 10px 24px rgba(212,160,23,.24);
    }

    .m-title {
      margin: 0;
      color: var(--gold-soft);
      font-size: 1.22rem;
    }

    .m-price {
      margin: 5px 0 0;
      color: #f5df8f;
      font-weight: 800;
      font-size: .96rem;
    }

    .i-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .info {
      border: 1px solid rgba(212,160,23,.22);
      border-radius: 10px;
      padding: 8px 10px;
      background: rgba(0,0,0,.27);
    }

    .info .k { font-size: .76rem; color: #cfcfcf; }
    .info .val { margin-top: 2px; font-size: 1.03rem; font-weight: 800; }

    .mini-chart {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 22px;
      height: 125px;
      border-bottom: 2px solid rgba(212,160,23,.22);
      margin-bottom: 6px;
      padding: 8px 6px 0;
    }

    .mini-labels {
      display: flex;
      justify-content: center;
      gap: 22px;
      font-size: .75rem;
      color: #ddd;
      margin-bottom: 12px;
    }

    .mini-labels div { width: 80px; text-align: center; }

    .m-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    @media (max-width: 1120px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 760px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .m-head {
        flex-direction: column;
        text-align: center;
      }

      .i-grid {
        grid-template-columns: 1fr;
      }

      .top-actions {
        margin-left: 0;
        width: 100%;
      }

      .top-actions button {
        flex: 1;
      }
    }

    @media (max-width: 420px) {
      .products-grid {
        grid-template-columns: 1fr;
      }
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="page">

    <div class="card">
      <div class="header">
        <a href="index.html" class="logo-box">
          <img src="logosopnaby.png" alt="Logo SNF" />
        </a>
        <div>
          <h1>Vitrine stock - Pôle vente SNF</h1>
          <p class="sub">Clique sur une photo pour ouvrir les détails du produit.</p>
        </div>

        <div class="top-actions">
          <button type="button" id="refreshBtn">Actualiser</button>
          <button type="button" id="exportBtn">Exporter CSV</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="summary">
        <div class="kpi"><div class="label">Produits</div><div class="value" id="sumProducts">0</div></div>
        <div class="kpi"><div class="label">CA potentiel</div><div class="value" id="sumPotential">0 €</div></div>
        <div class="kpi green"><div class="label">CA actuel</div><div class="value" id="sumActual">0 €</div></div>
        <div class="kpi red"><div class="label">Valeur stock restant</div><div class="value" id="sumStockValue">0 €</div></div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <input id="searchInput" class="search" placeholder="Rechercher un produit..." />
        <div class="sub" id="lastUpdate" style="text-align:right">Dernière mise à jour : -</div>
      </div>
    </div>

    <div class="card">
      <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="card">
      <div class="legend">
        <span class="pot">CA potentiel (tout le stock initial vendu)</span>
        <span class="act">CA actuel (déjà vendu)</span>
      </div>

      <div class="chart-scroll">
        <div class="chart" id="chart"></div>
        <div class="labels" id="chartLabels"></div>
      </div>
    </div>

    <div class="card">
      <div class="legend">
        <span class="recu">Reçus (stock initial)</span>
        <span class="vendu">Vendus (sorties)</span>
      </div>

      <div class="chart-scroll">
        <div class="chart" id="chartQty"></div>
        <div class="labels" id="chartQtyLabels"></div>
      </div>
    </div>

  </div>

  <div class="overlay" id="detailOverlay">
    <div class="modal" id="detailModal"></div>
  </div>

  <script>
    const STOCK_KEY = "snf_stock_v1";
    const PLACEHOLDER = "images/placeholder.png";
    const LOW_STOCK = 3;

    const FALLBACK_DATA = [
      { id:"p1", name:"Miroir", price:3, initial:30, out:12, image:"images_formulaire/miroir.jpg" },
      { id:"p2", name:"Marque page", price:5, initial:25, out:9, image:"images_formulaire/marque-page.jpg" },
      { id:"p3", name:"Ventilateur Dayane", price:15, initial:10, out:6, image:"images_formulaire/ventilateur-dayane.jpg" },
      { id:"p4", name:"Mug Bleu", price:15, initial:12, out:7, image:"images_formulaire/mug-bleu.jpg" },
      { id:"p5", name:"Mug Mahabba", price:15, initial:11, out:4, image:"images_formulaire/mug-mahabba.jpg" },
      { id:"p6", name:"Mug Istiqama", price:15, initial:11, out:3, image:"images_formulaire/mug-istiqama.jpg" },
      { id:"p7", name:"Mug Jaune", price:15, initial:11, out:2, image:"images_formulaire/mug-jaune.jpg" },
      { id:"p8", name:"Boutons (paire)", price:10, initial:14, out:5, image:"images_formulaire/boutons-paire.jpg" },
      { id:"p9", name:"Eventail", price:7, initial:18, out:11, image:"images_formulaire/eventail.jpg" },
      { id:"p10", name:"Gourde Orange", price:20, initial:8, out:4, image:"images_formulaire/gourde-orange.jpg" },
      { id:"p11", name:"Gourde Blanche", price:20, initial:8, out:2, image:"images_formulaire/gourde-blanche.jpg" }
    ];

    let allStock = [];
    let filteredStock = [];
    let currentId = null;

    const productsGrid = document.getElementById("productsGrid");
    const chart = document.getElementById("chart");
    const chartLabels = document.getElementById("chartLabels");
    const chartQty = document.getElementById("chartQty");
    const chartQtyLabels = document.getElementById("chartQtyLabels");
    const searchInput = document.getElementById("searchInput");
    const overlay = document.getElementById("detailOverlay");
    const detailModal = document.getElementById("detailModal");
    const lastUpdate = document.getElementById("lastUpdate");

    function esc(v) {
      return String(v == null ? "" : v)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function money(v) {
      return new Intl.NumberFormat("fr-FR", { style:"currency", currency:"EUR" }).format(Number(v) || 0);
    }

    function readStock() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STOCK_KEY) || "null");
        if (Array.isArray(parsed) && parsed.length) return parsed;
      } catch (e) {}
      return FALLBACK_DATA;
    }

    function normalizeItem(item, index) {
      return {
        id: item.id || ("p" + index + "_" + Date.now()),
        name: item.name || "Produit",
        price: Number(item.price) || 0,
        initial: Math.max(0, Number(item.initial) || 0),
        out: Math.max(0, Number(item.out) || 0),
        image: item.image || PLACEHOLDER
      };
    }

    function compute(p) {
      const initial = p.initial;
      const out = Math.min(p.out, p.initial);
      const remaining = initial - out;
      const potential = initial * p.price;
      const actual = out * p.price;
      const stockValue = remaining * p.price;
      return { initial, out, remaining, potential, actual, stockValue };
    }

    function stockState(remaining) {
      if (remaining <= 0) return { cls:"out", label:"Rupture" };
      if (remaining <= LOW_STOCK) return { cls:"low", label:"Stock bas" };
      return { cls:"ok", label:"OK" };
    }

    function photo(path, cls, alt) {
      return `<img class="${cls}" src="${esc(path || PLACEHOLDER)}" alt="${esc(alt || "")}" onerror="this.onerror=null;this.src='${PLACEHOLDER}'" />`;
    }

    function refreshData() {
      allStock = readStock().map(normalizeItem);
      applyFilter();
      renderAll();
      lastUpdate.textContent = "Dernière mise à jour : " + new Date().toLocaleTimeString("fr-FR");
    }

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      filteredStock = allStock.filter(function (p) {
        return p.name.toLowerCase().includes(q);
      });
    }

    function renderCards() {
      productsGrid.innerHTML = "";

      if (!filteredStock.length) {
        productsGrid.innerHTML = `<div class="empty">Aucun produit trouvé.</div>`;
        return;
      }

      filteredStock.forEach(function (p) {
        const c = compute(p);
        const s = stockState(c.remaining);

        const card = document.createElement("div");
        card.className = "p-card";
        card.dataset.id = p.id;
        card.innerHTML = `
          <div class="p-badge-wrap"><span class="badge ${s.cls}">${s.label}</span></div>
          ${photo(p.image, "p-photo", p.name)}
          <div class="p-content">
            <h3 class="p-name">${esc(p.name)}</h3>
            <div class="p-meta">
              <div>Restant : <strong>${c.remaining}</strong> unité(s)</div>
              <div>Prix : <strong>${money(p.price)}</strong></div>
            </div>
          </div>
        `;
        productsGrid.appendChild(card);
      });
    }

    function renderSummary() {
      let sumPotential = 0, sumActual = 0, sumStockValue = 0;

      filteredStock.forEach(function (p) {
        const c = compute(p);
        sumPotential += c.potential;
        sumActual += c.actual;
        sumStockValue += c.stockValue;
      });

      document.getElementById("sumProducts").textContent = filteredStock.length;
      document.getElementById("sumPotential").textContent = money(sumPotential);
      document.getElementById("sumActual").textContent = money(sumActual);
      document.getElementById("sumStockValue").textContent = money(sumStockValue);
    }

    function renderChart() {
      chart.innerHTML = "";
      chartLabels.innerHTML = "";

      if (!filteredStock.length) return;

      const maxPotential = Math.max.apply(
        null,
        filteredStock.map(function (p) { return compute(p).potential; }).concat([1])
      );

      filteredStock.forEach(function (p) {
        const c = compute(p);
        const hPot = Math.max(1, (c.potential / maxPotential) * 100);
        const hAct = Math.max(1, (c.actual / maxPotential) * 100);

        const group = document.createElement("div");
        group.className = "group";
        group.innerHTML = `
          <div class="bars">
            <div class="col">
              <div class="v">${money(c.potential)}</div>
              <div class="bar pot" style="height:${hPot * 0.82}%"></div>
            </div>
            <div class="col">
              <div class="v">${money(c.actual)}</div>
              <div class="bar act" style="height:${hAct * 0.82}%"></div>
            </div>
          </div>
        `;
        chart.appendChild(group);

        const label = document.createElement("div");
        label.textContent = p.name;
        chartLabels.appendChild(label);
      });
    }

    function renderChartQty() {
      chartQty.innerHTML = "";
      chartQtyLabels.innerHTML = "";

      if (!filteredStock.length) return;

      const maxQty = Math.max.apply(
        null,
        filteredStock.map(function (p) { return compute(p).initial; }).concat([1])
      );

      filteredStock.forEach(function (p) {
        const c = compute(p);
        const hRecu = Math.max(1, (c.initial / maxQty) * 100);
        const hVendu = Math.max(1, (c.out / maxQty) * 100);

        const group = document.createElement("div");
        group.className = "group";
        group.innerHTML = `
          <div class="bars">
            <div class="col">
              <div class="v">${c.initial}</div>
              <div class="bar recu" style="height:${hRecu * 0.82}%"></div>
            </div>
            <div class="col">
              <div class="v">${c.out}</div>
              <div class="bar vendu" style="height:${hVendu * 0.82}%"></div>
            </div>
          </div>
        `;
        chartQty.appendChild(group);

        const label = document.createElement("div");
        label.textContent = p.name;
        chartQtyLabels.appendChild(label);
      });
    }

    function renderAll() {
      renderSummary();
      renderCards();
      renderChart();
      renderChartQty();
    }

    function openDetail(id) {
      currentId = id;
      const p = allStock.find(function (x) { return x.id === id; });
      if (!p) return;

      const c = compute(p);
      const s = stockState(c.remaining);
      const max = Math.max(c.potential, c.actual, 1);
      const hPot = (c.potential / max) * 85;
      const hAct = (c.actual / max) * 85;

      detailModal.innerHTML = `
        <div class="m-head">
          ${photo(p.image, "m-photo", p.name)}
          <div>
            <h3 class="m-title">${esc(p.name)}</h3>
            <p class="m-price">${money(p.price)} / unité</p>
            <span class="badge ${s.cls}">${s.label}</span>
          </div>
        </div>

        <div class="i-grid">
          <div class="info"><div class="k">Stock initial</div><div class="val">${c.initial}</div></div>
          <div class="info"><div class="k">Sortie</div><div class="val">${c.out}</div></div>
          <div class="info"><div class="k">Stock restant</div><div class="val">${c.remaining}</div></div>
          <div class="info"><div class="k">Valeur stock restant</div><div class="val" style="color:#ef4444">${money(c.stockValue)}</div></div>
          <div class="info"><div class="k">CA actuel</div><div class="val" style="color:#4ade80">${money(c.actual)}</div></div>
          <div class="info"><div class="k">CA potentiel</div><div class="val" style="color:var(--gold-soft)">${money(c.potential)}</div></div>
        </div>

        <div class="mini-chart">
          <div class="col">
            <div class="v">${money(c.potential)}</div>
            <div class="bar pot" style="height:${hPot}%"></div>
          </div>
          <div class="col">
            <div class="v">${money(c.actual)}</div>
            <div class="bar act" style="height:${hAct}%"></div>
          </div>
        </div>
        <div class="mini-labels">
          <div>Potentiel</div>
          <div>Actuel</div>
        </div>

        <div class="m-actions">
          <button type="button" id="closeModalBtn">Fermer</button>
        </div>
      `;

      overlay.classList.add("active");
    }

    function closeDetail() {
      overlay.classList.remove("active");
      currentId = null;
    }

    productsGrid.addEventListener("click", function (event) {
      const card = event.target.closest(".p-card[data-id]");
      if (!card) return;
      openDetail(card.dataset.id);
    });

    overlay.addEventListener("click", function (event) {
      if (event.target === overlay) closeDetail();
    });

    detailModal.addEventListener("click", function (event) {
      if (event.target.id === "closeModalBtn") closeDetail();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closeDetail();
    });

    searchInput.addEventListener("input", function () {
      applyFilter();
      renderAll();
    });

    document.getElementById("refreshBtn").addEventListener("click", function () {
      refreshData();
    });

    document.getElementById("exportBtn").addEventListener("click", function () {
      if (!filteredStock.length) return alert("Aucune donnée à exporter.");

      function safe(v) {
        let s = String(v);
        if (/^[=+\-@]/.test(s)) s = "'" + s;
        return '"' + s.replace(/"/g, '""') + '"';
      }

      const headers = ["Produit","Stock initial","Sortie","Restant","Prix unitaire","CA actuel","CA potentiel","Valeur stock restant"];
      const lines = [headers.join(",")];

      filteredStock.forEach(function (p) {
        const c = compute(p);
        lines.push([p.name, c.initial, c.out, c.remaining, p.price, c.actual, c.potential, c.stockValue].map(safe).join(","));
      });

      const csv = "\uFEFF" + lines.join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "vitrine_stock_snf_" + new Date().toISOString().slice(0,10) + ".csv";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    });

    refreshData();
    setInterval(refreshData, 30000);
  </script>
</body>
</html>
